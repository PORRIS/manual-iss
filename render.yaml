# Despliegue en Render (https://render.com): New > Blueprint > elegir este repositorio.
# La BD no está en el repositorio (salida/ en .gitignore): se genera en el build con etl.py
# a partir del XLS, los CSV del PDF y correcciones.csv, que sí están versionados.
services:
  - type: web
    name: manual-iss-2001
    runtime: python
    plan: free
    region: oregon
    branch: master
    buildCommand: pip install uv && uv sync --frozen && uv run --frozen etl.py
    startCommand: uv run --frozen uvicorn web.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /salud
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: WEB_USUARIO
        value: revisor
      - key: WEB_CLAVE          # Render la pide al crear el servicio; no queda en el repositorio
        sync: false
