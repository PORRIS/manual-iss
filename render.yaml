# Despliegue en Render (https://render.com): New > Blueprint > elegir este repositorio.
# Las BD no están en el repositorio (salida/ en .gitignore): se generan en el build.
# - Manual ISS: etl.py a partir del XLS, los CSV del PDF y correcciones.csv.
# - Manual SOAT 2026 (UVB): soat2026/extraer.py + etl.py desde el PDF de «manual tarifario sota/»,
#   con sus pruebas; si un control o una prueba falla, el despliegue no se publica.
services:
  - type: web
    name: manual-iss-2001
    runtime: python
    plan: free
    region: oregon
    branch: master
    buildCommand: >-
      pip install uv && uv sync --frozen && uv run --frozen etl.py
      && uv run --frozen soat2026/extraer.py && uv run --frozen soat2026/etl.py
      && uv run --frozen soat2026/pruebas.py && uv run --frozen soat2026/pruebas_cotizar.py
    startCommand: uv run --frozen uvicorn web.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /salud
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: WEB_USUARIO
        value: revisor
      - key: WEB_CLAVE          # Render la pide al crear el servicio; no queda en el repositorio
        sync: false
